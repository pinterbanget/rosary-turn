<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosary Turn · OpenRosary</title>
  <link rel="stylesheet" href="/openrosary.css">
  <link rel="stylesheet" href="/reader.css">
  <script src="/theme.js"></script>
  <script type="module" src="/reader.js"></script>
</head>
<body>
  <div id="card">
    <header class="agent-strip" aria-label="Coding session">
      <span id="agent-status" role="status">connecting to your session…</span>
      <button id="back-agent" class="back-link" hidden>back to agent</button>
      <button id="dismiss" class="back-link" hidden>close</button>
    </header>
    <main id="reader" class="rosary-page">
      <div class="rosary-container">
        <div class="rosary-header">
          <button id="choose" class="back-link">← mysteries</button>
          <div class="reader-preferences">
            <select id="language" class="lang-dropdown" aria-label="Reading language"><option value="en">EN</option><option value="id">ID</option></select>
            <label class="latin-control"><input id="latin" type="checkbox"> latin</label>
            <button id="theme" class="colour-control" aria-label="Switch colour mode">light</button>
          </div>
        </div>
        <h1 id="mystery-title" class="mystery-title">today’s mysteries</h1>
        <h2 id="prayer-label" class="prayer-label">loading prayer…</h2>
        <div id="prayer-pane" class="prayer-container" tabindex="0" aria-label="Prayer text">
          <p id="prayer-text" class="prayer-text"></p>
        </div>
        <div class="progress-section">
          <div id="progress" class="progress-bar" role="progressbar" aria-label="Rosary progress" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0"><div id="progress-fill" class="progress-fill" style="transform: scaleX(0)"></div></div>
          <span id="progress-text" class="progress-text">0/80</span>
        </div>
        <div class="prayer-navigation"><button id="prev" class="mystery-btn">previous</button><button id="next" class="mystery-btn">next prayer</button></div>
        <p id="instructions" class="instructions">use arrow keys or swipe to navigate</p>
        <div id="completion" class="completion" hidden><p id="completion-text">Rosary complete. God bless you.</p><button id="restart" class="mystery-btn">pray again</button></div>
      </div>
    </main>
    <main id="selection" class="hero" hidden>
      <div class="container"><div class="hero-content">
        <h1 class="site-title">(openrosary)</h1>
        <p id="tagline" class="tagline">a simple web-based rosary tool.</p>
        <nav id="mysteries" class="mysteries-grid" aria-label="mystery selection"></nav>
        <p id="suggestion" class="hint"></p>
        <button id="resume" class="mystery-btn resume-button">resume prayer</button>
        <p class="hint">pray while your coding agent works.</p>
      </div></div>
    </main>
    <div id="save-error" class="save-error" role="alert" hidden><span id="error-text"></span> <button id="retry" class="mystery-btn">retry save</button></div>
    <footer class="credits">Rosary Turn · based on <a href="https://github.com/rzrizaldy/quran-turn" target="_blank" rel="noreferrer">Quran Turn by Rizaldy</a> · <a href="https://github.com/pinterbanget/openrosary-web" target="_blank" rel="noreferrer">OpenRosary</a></footer>
  </div>
</body>
</html>
